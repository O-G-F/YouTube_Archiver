# ============================================================
# yt-dlp_base.conf  (共通設定)
#
# 役割:
# - どの選択肢でも共通に使う「安全で競合しない」設定のみを集約する
# - 出力先(--output)や履歴(--download-archive)など“動作/運用で変わるもの”は
#   overlay（yt-dlp(Movie).conf 等）または bat 側で指定する前提
# - プラットフォーム固有（YouTube/Twitch）の差は別confで吸収する
#   例:
#     YouTube: yt-dlp_youtube.conf  （--sub-langs all / SponsorBlock 等）
#     Twitch : yt-dlp_twitch.conf   （--sub-langs "all,-rechat" / live-from-start 等）
#
# 呼び出し想定（bat側）:
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_youtube.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_youtube.conf" --config-locations "<overlay conf>" ...
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_twitch.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_twitch.conf"  --config-locations "<overlay conf>" ...
#
# 変更履歴（今後追記）:
# - 2025-12-28: 旧各confに散在していた共通項を集約（表示/耐障害/リンク/環境依存）
# - 2025-12-28: --embed-metadata と --add-metadata の重複を解消（embed側に統一）
# - 2025-12-28: --embed-chapters と --add-chapters の重複を解消（embed側に統一）
# - 2025-12-28: --download-archive と --no-download-archive の矛盾は base から排除（overlayへ移管）
# ============================================================


# ===== 失敗耐性・性能 =====
# 目的: 一時的な通信/ファイルアクセス失敗に強くし、途中失敗で全体停止しないようにする
--no-abort-on-error
--retries 5
--file-access-retries 5
--concurrent-fragments 10


# ===== 情報系（競合しない範囲で保持） =====
# 目的: 後から再現/整理できるようにメタ情報を残す
--write-info-json
--embed-info-json
--write-description
--write-playlist-metafiles


# ===== メタデータ/チャプター（冗長指定を排除） =====
# 旧運用: --embed-metadata と --add-metadata が同居していたため、冗長/保守性低下
# 方針: embed-* のみに統一（add-* はエイリアス扱いのためコメントとして記録）
--embed-metadata
# （参考: 旧運用で併用されていたもの。今後必要があればどちらか一方のみ使う）
# --add-metadata

--embed-chapters
# （参考: 旧運用で併用されていたもの。今後必要があればどちらか一方のみ使う）
# --add-chapters


# ===== リンク（便利機能、競合なし） =====
# 目的: URL の参照を残しておく（後から元URLに戻れる）
--write-link
--write-url-link
--write-webloc-link
--write-desktop-link


# ===== 表示 =====
# 目的: 実行中の状況が追えるようにする（bat側でログ保存も行う）
--mtime
--console-title
--newline
--progress


# ===== Windows向け =====
# 目的: Windowsで問題になりやすいファイル名を安全化
--windows-filenames


# ===== 環境依存 =====
# 目的: cookie/ffmpeg を明示指定し、環境差で動かない事象を減らす
# 注: cookies.txt は bat と同じディレクトリを bat 側から参照する
# --cookies "C:\yt-dlp\cookies.txt"
# YouTube challenge 対策の --remote-components ejs:github と Deno 指定は bat 側で YouTube 選択時のみ追加する
# --ffmpeg-location "C:\ffmpeg\bin"
# ffmpeg は bat 側で自動選択する（PATH → bat直下\ffmpeg.exe → bat直下\ffmpeg\bin）


# ===== 出力/履歴は base では扱わない =====
# 理由: 選択肢や保存先設定（batの9番）で変動するため
# --output "D:\YouTube\%(title)s\%(title)s.%(ext)s"
# --download-archive "history.txt"
# --no-download-archive

