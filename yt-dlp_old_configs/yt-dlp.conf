# ============================================================
# yt-dlp.conf  (1. 選択保存 overlay)
#
# 役割:
# - 「選択保存」動作に固有の設定のみを持つ
# - プラットフォーム固有（YouTube/Twitch）の差は、別confで吸収する
#   例:
#     YouTube: yt-dlp_youtube.conf  （--sub-langs all / SponsorBlock 等）
#     Twitch : yt-dlp_twitch.conf   （--sub-langs "all,-rechat" / live-from-start 等）
#
# 呼び出し想定（bat側）:
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_youtube.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_youtube.conf" --config-locations "C:\yt-dlp\yt-dlp.conf" <URL>
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_twitch.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_twitch.conf"  --config-locations "C:\yt-dlp\yt-dlp.conf" <URL>
#
# 設計メモ:
# - bat 側で -o を付けて保存先を上書きする運用のため、ここでは --output を固定しない
# - bat の「フォーマット選択(-F→ID入力)」に対応するため、ここでは format を固定しない
#   （プラットフォームやURLによって適切なIDが変わるため）
#
# 変更履歴（今後追記）:
# - 2025-12-28: 旧設定の出力固定(--output "D:\YouTube\...")を削除（batで保存先変更に対応）
# - 2025-12-28: --download-archive と --no-download-archive の矛盾を解消（--download-archive のみ採用）
# - 2025-12-28: SponsorBlock / live-from-start / sub-langs を削除（プラットフォームconfへ移管）
# - 2025-12-28: add-metadata/add-chapters を削除（base 側で embed-* に統一）
# - 2025-12-28: force-overwrites は運用事故防止のためコメントアウト（必要時のみ有効化）
# ============================================================


# ===== プレイリスト抑止（選択保存は単体想定） =====
# 目的: URL にプレイリスト要素が含まれる場合でも、単体として扱う
--no-playlist


# ===== フォーマット（選択保存は bat 側で選択できるようにする） =====
# 旧運用: --format "bestvideo+bestaudio/best" を固定していたケースがある
# 新運用: bat で -F 一覧表示→ID入力→-f を指定可能なため、ここでは固定しない
# --format "bestvideo+bestaudio/best"
# --merge-output-format mkv


# ===== サムネイル（選択保存では保持するのが基本） =====
--write-thumbnail
--embed-thumbnail
--convert-thumbnails jpg


# ===== 履歴（重複DLのスキップ） =====
# 旧運用: --download-archive と --no-download-archive が同居して矛盾していた
# 方針: 選択保存でも再実行しやすいので archive を有効化する
--download-archive "history.txt"


# ===== 必要時のみ: 強制上書き =====
# 運用上の注意:
# - archive が有効だと「そもそも再DLしない」が基本
# - 強制上書きしたい場合は archive を止めるか、履歴ファイルを別にする
# --force-overwrites


# ===== 出力先は bat で上書き =====
# 理由: 9.保存先設定（デフォルト）で保存先を変えられるようにするため
# --output "D:\YouTube\%(title)s\%(title)s.%(ext)s"
