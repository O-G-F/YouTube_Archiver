# ============================================================
# yt-dlp(Movie).conf  (4. 単体保存: 動画 overlay)
#
# 役割:
# - 「単体保存（動画）」動作に固有の設定のみを持つ
# - プラットフォーム固有（YouTube/Twitch）の差は、別confで吸収する
#   例:
#     YouTube: yt-dlp_youtube.conf  （--sub-langs all / SponsorBlock 等）
#     Twitch : yt-dlp_twitch.conf   （--sub-langs "all,-rechat" / live-from-start 等）
#
# 呼び出し想定（bat側）:
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_youtube.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_youtube.conf" --config-locations "C:\yt-dlp\yt-dlp(Movie).conf" <URL>
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_twitch.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_twitch.conf"  --config-locations "C:\yt-dlp\yt-dlp(Movie).conf" <URL>
#
# 設計メモ:
# - 動画は bestvideo+bestaudio/best をデフォルト（画質選択は「選択保存」で行う想定）
# - 保存先は bat 側で -o を付けて上書きする運用（9.保存先設定と整合）
#
# 変更履歴（今後追記）:
# - 2025-12-28: 出力固定(--output "...")を削除（batで保存先を上書きするため）
# - 2025-12-28: --no-download-archive を削除（--download-archive と矛盾するため）
# - 2025-12-28: SponsorBlock / live-from-start / sub-langs を削除（プラットフォームconfへ移管）
# - 2025-12-28: add-metadata/add-chapters を削除（base 側で embed-* に統一）
# - 2025-12-28: force-overwrites は運用事故防止のためコメントアウト（必要時のみ有効化）
# ============================================================


# ===== フォーマット（動画+音声） =====
# 目的: 通常の動画保存では最高画質の映像+音声を優先
--format "bestvideo+bestaudio/best"

# 目的: 最終コンテナを統一（後処理や再生互換性のため）
--merge-output-format mkv


# ===== プレイリスト抑止（単体保存想定） =====
--no-playlist


# ===== サムネイル（動画では保持するのが基本） =====
--write-thumbnail
--embed-thumbnail
--convert-thumbnails jpg


# ===== 履歴（重複DLのスキップ） =====
--download-archive "history(Movie).txt"


# ===== 必要時のみ: 強制上書き =====
# 運用上の注意:
# - archive が有効だと「そもそも再DLしない」が基本
# - 強制上書きしたい場合は archive を止めるか、履歴ファイルを別にする
# --force-overwrites


# ===== 出力先は bat で上書き =====
# --output "D:\YouTube\動画\%(title)s\%(title)s.%(ext)s"
