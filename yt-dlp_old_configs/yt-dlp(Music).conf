# ============================================================
# yt-dlp(Music).conf  (3. 単体保存: 音楽 overlay)
#
# 役割:
# - 「単体保存（音楽）」動作に固有の設定のみを持つ
# - プラットフォーム固有（YouTube/Twitch）の差は、別confで吸収する
#   例:
#     YouTube: yt-dlp_youtube.conf  （--sub-langs all / SponsorBlock 等）
#     Twitch : yt-dlp_twitch.conf   （--sub-langs "all,-rechat" / live-from-start 等）
#
# 呼び出し想定（bat側）:
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_youtube.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_youtube.conf" --config-locations "C:\yt-dlp\yt-dlp(Music).conf" <URL>
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_twitch.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_twitch.conf"  --config-locations "C:\yt-dlp\yt-dlp(Music).conf" <URL>
#
# 設計メモ:
# - 「音楽」は bestaudio を優先（動画は不要）
# - 保存先は bat 側で -o を付けて上書きする運用（9.保存先設定と整合）
#
# 変更履歴（今後追記）:
# - 2025-12-28: 出力固定(--output "...")を削除（batで保存先を上書きするため）
# - 2025-12-28: --no-download-archive を削除（--download-archive と矛盾するため）
# - 2025-12-28: SponsorBlock / live-from-start / sub-langs を削除（プラットフォームconfへ移管）
# - 2025-12-28: add-metadata/add-chapters を削除（base 側で embed-* に統一）
# - 2025-12-28: force-overwrites は運用事故防止のためコメントアウト（必要時のみ有効化）
# ============================================================


# ===== フォーマット（音声のみ） =====
# 目的: 音声のみ取得（動画不要）
--format bestaudio
--extract-audio
--audio-format flac


# ===== プレイリスト抑止（単体保存想定） =====
--no-playlist


# ===== サムネイル（音声でも保持する運用） =====
# 目的: 音声ファイルにサムネを付けたい/後で参照したい場合に有効
--write-thumbnail
--convert-thumbnails jpg

# 参考:
# 音声ファイルへサムネ埋め込みをしたい場合は、ffmpeg が必要で環境依存度が上がるため
# 現時点では保留（必要になったら有効化）
--embed-thumbnail


# ===== 履歴（重複DLのスキップ） =====
--download-archive "history(Music).txt"


# ===== 必要時のみ: 強制上書き =====
# 運用上の注意:
# - archive が有効だと「そもそも再DLしない」が基本
# - 強制上書きしたい場合は archive を止めるか、履歴ファイルを別にする
# --force-overwrites


# ===== 出力先は bat で上書き =====
# --output "D:\YouTube\音楽\%(title)s\%(title)s.%(ext)s"
