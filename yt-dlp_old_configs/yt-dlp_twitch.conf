# ============================================================
# yt-dlp_twitch.conf  (Twitch専用)
#
# 役割:
# - Twitch を対象にしたときだけ有効にしたい設定を集約する
# - YouTube では意味が薄い/無視され得るオプションは、ここでのみ有効化する
#
# 要件:
# - Twitch の場合は --sub-langs "all,-rechat"
# - Twitch の字幕/チャット類は取得不可(404/403)が起きやすいため、
#   rechat を除外して全体の失敗を避ける
#
# 呼び出し想定（bat側）:
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_twitch.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_twitch.conf" --config-locations "<overlay conf>" ...
#
# 変更履歴（今後追記）:
# - 2025-12-28: base を取り込み（共通設定の一本化）
# - 2025-12-28: --live-from-start を有効化（Twitch ライブ取得で効果が期待できる）
# - 2025-12-28: --sub-langs "all,-rechat" を採用（rechat を除外して失敗率を下げる）
# ============================================================


# ===== 共通設定の取り込み =====
# 目的: 共通設定を yt-dlp_base.conf に集約し、重複と設定ズレを防止
# --config-locations "C:\yt-dlp\yt-dlp_base.conf"


# ===== Twitch ライブ =====
# 目的: ライブ配信を取得する際、可能な範囲で先頭から保存する
# 注: 他サイト(YouTube等)では意味が薄い/無視される可能性があるため、Twitch専用confに隔離
--live-from-start


# ===== 字幕（Twitch） =====
# 目的: 取得できる字幕は可能な限り保持する
--write-subs

# 要件: Twitch の場合は "all,-rechat"
# 注: rechat は 404/403 が起きやすく、--sub-langs all のままだと失敗で止まる/エラーが目立つため除外
--sub-langs "all,-rechat"

# （参考: もし rechat の取得に成功する環境/動画があるなら、下を使う運用も可能）
# --sub-langs all
