# ============================================================
# yt-dlp_youtube.conf  (YouTube専用)
#
# 役割:
# - YouTube を対象にしたときだけ有効にしたい設定を集約する
# - Twitch では意味が薄い/非対応になり得るオプションは、ここでのみ有効化する
#
# 呼び出し想定（bat側）:
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_youtube.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_youtube.conf" --config-locations "<overlay conf>" ...
#
# 変更履歴（今後追記）:
# - 2025-12-28: base を取り込み（共通設定の一本化）
# - 2025-12-28: --sub-langs all を採用（YouTube は字幕を最大限保持）
# - 2025-12-28: SponsorBlock を有効化（YouTube 対象、Twitch では意味が薄い/非対応）
# ============================================================


# ===== 共通設定の取り込み =====
# 目的: 共通設定を yt-dlp_base.conf に集約し、重複と設定ズレを防止
# --config-locations "C:\yt-dlp\yt-dlp_base.conf"


# ===== 字幕（YouTube） =====
# 目的: 可能な限り字幕を保持し、動画と同じフォルダに保存/埋め込みする
--write-subs
--embed-subs

# 要件: YouTube の場合は --sub-langs all
# 注: "all" は全言語を対象（必要に応じて "ja,en" 等に絞る運用も可能）
--sub-langs all


# ===== SponsorBlock（YouTube向け） =====
# 目的: スポンサー等の区間情報を取得/マークする（YouTubeで有効）
# 注: TwitchVod では「非対応」として扱われることがあり得るため、
#     YouTube 選択時のみ読み込むこの conf に限定して有効化する
--sponsorblock-mark all,-preview

# （参考: Twitch 等でログに SponsorBlock 非対応が出るのを避けたい場合は、この行をコメントアウト）
# --sponsorblock-mark all,-preview

# ===== Twitch ライブ =====
# 目的: ライブ配信を取得する際、可能な範囲で先頭から保存する
# 注: 他サイト(YouTube等)では意味が薄い/無視される可能性がある
--live-from-start
