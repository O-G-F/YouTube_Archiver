# ============================================================
# yt-dlp(Playlist-Movie).conf  (7. プレイリスト保存: 動画 overlay)
#
# 役割:
# - 「プレイリスト保存（動画）」動作に固有の設定のみを持つ
# - プラットフォーム固有（YouTube/Twitch）の差は、別confで吸収する
#   例:
#     YouTube: yt-dlp_youtube.conf  （--sub-langs all / SponsorBlock 等）
#     Twitch : yt-dlp_twitch.conf   （--sub-langs "all,-rechat" / live-from-start 等）
#
# 呼び出し想定（bat側）:
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_youtube.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_youtube.conf" --config-locations "C:\yt-dlp\yt-dlp(Playlist-Movie).conf" <Playlist URL>
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_twitch.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_twitch.conf"  --config-locations "C:\yt-dlp\yt-dlp(Playlist-Movie).conf" <Playlist URL>
#
# 設計メモ:
# - 動画プレイリストは bestvideo+bestaudio/best をデフォルト
# - 保存先は bat 側で -o を付けて上書きする運用（9.保存先設定と整合）
# - 現行運用では動画プレイリストの出力に %(title)s を使っていたため、
#   bat 側の -o もそれを踏襲する想定（必要なら %(playlist_title)s に変更可能）
#
# 変更履歴（今後追記）:
# - 2025-12-28: 出力固定(--output "...")を削除（batで保存先を上書きするため）
# - 2025-12-28: --no-download-archive を削除（--download-archive と矛盾するため）
# - 2025-12-28: SponsorBlock / live-from-start / sub-langs を削除（プラットフォームconfへ移管）
# - 2025-12-28: add-metadata/add-chapters を削除（base 側で embed-* に統一）
# - 2025-12-28: force-overwrites は運用事故防止のためコメントアウト（必要時のみ有効化）
# ============================================================


# ===== フォーマット（動画+音声） =====
--format "bestvideo+bestaudio/best"
--merge-output-format mkv

#iPod用
#--format "bv*[vcodec^=avc1][ext=mp4][fps<=30][height<=480]+ba[ext=m4a]/b[ext=mp4][height<=480]"
#--merge-output-format mp4

# ===== サムネイル（動画では保持するのが基本） =====
--write-thumbnail
--embed-thumbnail
--convert-thumbnails jpg


# ===== 履歴（重複DLのスキップ） =====
--download-archive "history(MoviePlayList).txt"


# ===== 必要時のみ: 強制上書き =====
# 運用上の注意:
# - archive が有効だと「そもそも再DLしない」が基本
# - 強制上書きしたい場合は archive を止めるか、履歴ファイルを別にする
# --force-overwrites


# ===== 出力先は bat で上書き =====
# bat側の想定例（現行踏襲）:
# -o "%OUTROOT%\動画プレイリスト\%(title)s\%(title)s.%(ext)s"
# （必要なら playlist_title を使う構造へ変更可能）
# --output "D:\YouTube\動画プレイリスト\%(title)s\%(title)s.%(ext)s"
