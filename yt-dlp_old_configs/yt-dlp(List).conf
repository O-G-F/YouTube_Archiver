# ============================================================
# yt-dlp(List).conf  (2. リスト保存: dlurl.txt overlay)
#
# 役割:
# - 「リスト保存」動作に固有の設定のみを持つ
# - プラットフォーム固有（YouTube/Twitch）の差は、別confで吸収する
#   例:
#     YouTube: yt-dlp_youtube.conf  （--sub-langs all / SponsorBlock 等）
#     Twitch : yt-dlp_twitch.conf   （--sub-langs "all,-rechat" / live-from-start 等）
#
# 呼び出し想定（bat側）:
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_youtube.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_youtube.conf" --config-locations "C:\yt-dlp\yt-dlp(List).conf"
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_twitch.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_twitch.conf"  --config-locations "C:\yt-dlp\yt-dlp(List).conf"
#
# 設計メモ:
# - リスト対象は dlurl.txt で管理する（複数URLの一括処理）
# - 保存先は bat 側で -o を付けて上書きする運用（9.保存先設定と整合）
#
# 変更履歴（今後追記）:
# - 2025-12-28: 出力固定(--output "...")を削除（batで保存先を上書きするため）
# - 2025-12-28: --no-download-archive を削除（--download-archive と矛盾するため）
# - 2025-12-28: SponsorBlock / live-from-start / sub-langs を削除（プラットフォームconfへ移管）
# - 2025-12-28: add-metadata/add-chapters を削除（base 側で embed-* に統一）
# - 2025-12-28: force-overwrites は運用事故防止のためコメントアウト（必要時のみ有効化）
# ============================================================


# ===== 入力（リスト） =====
# リストファイル。
# - 既定: dlurl.txt（bat と同じディレクトリに置く想定）
# - bat は存在チェックを行い、bat と同じ実行ディレクトリの dlurl.txt を -a で渡す
# -a "C:\yt-dlp\dlurl.txt"

# 代替（運用で相対パスにしたい場合）:
# - bat が C:\yt-dlp\ を作業ディレクトリとして起動される前提なら相対指定も可
# -a dlurl.txt

# 代替（オプション名を明示したい場合）:
# --batch-file "C:\yt-dlp\dlurl.txt"


# ===== 履歴（重複DLのスキップ） =====
# 旧運用: --download-archive と --no-download-archive が同居して矛盾していた
# 方針: リスト保存は「再実行が多い」ため archive を有効化するのが基本
--download-archive "history(List).txt"


# ===== 必要時のみ: 強制上書き =====
# 運用上の注意:
# - archive が有効だと「そもそも再DLしない」が基本
# - 強制上書きしたい場合は archive を止めるか、履歴ファイルを別にする
# --force-overwrites


# ===== 出力先は bat で上書き =====
# 旧運用: conf 側で D:\YouTube\... に固定していた
# 新運用: YouTube/Twitch 選択＋保存先設定(9番)に対応するため、bat が -o で必ず指定する
# --output "D:\YouTube\%(title)s\%(title)s.%(ext)s"
