# ============================================================
# yt-dlp(Thumbnail).conf  (5. サムネイル保存 overlay)
#
# 役割:
# - 「サムネイル保存」動作に固有の設定のみを持つ
# - プラットフォーム固有（YouTube/Twitch）の差は、別confで吸収する
#   例:
#     YouTube: yt-dlp_youtube.conf  （--sub-langs all / SponsorBlock 等）
#     Twitch : yt-dlp_twitch.conf   （--sub-langs "all,-rechat" / live-from-start 等）
#
# 呼び出し想定（bat側）:
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_youtube.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_youtube.conf" --config-locations "C:\yt-dlp\yt-dlp(Thumbnail).conf" <URL>
#   yt-dlp_new.bat 側で "%BASE_DIR%yt-dlp_base.conf" と "%BASE_DIR%yt-dlp_twitch.conf" を読み込む想定 # 旧例: yt-dlp --config-locations "C:\yt-dlp\yt-dlp_twitch.conf"  --config-locations "C:\yt-dlp\yt-dlp(Thumbnail).conf" <URL>
#
# 設計メモ:
# - 本体の動画/音声は保存せず（--skip-download）、サムネイルのみを保存する
# - 保存先は bat 側で -o を付けて上書きする運用（9.保存先設定と整合）
#
# 変更履歴（今後追記）:
# - 2025-12-28: 出力固定(--output "...")を削除（batで保存先を上書きするため）
# - 2025-12-28: console-title 等の共通表示設定は base へ移管（重複回避）
# - 2025-12-28: --download-archive は運用方針が割れるためデフォルト無効（必要時のみ有効化）
# - 2025-12-28: force-overwrites は上書きニーズがあり得るためコメントアウトで残す
# ============================================================


# ===== 本体ダウンロードをしない =====
# 目的: サムネイルのみ取得して処理時間と容量を抑える
--skip-download


# ===== サムネイル保存 =====
--write-thumbnail

# 目的: 画像形式を統一（運用/閲覧のしやすさ）
--convert-thumbnails jpg


# ===== 履歴（任意） =====
# サムネイルは「取り直し」が発生しやすく、archive との相性が悪いことがあるためデフォルト無効。
# もし「同じURLのサムネは二度と保存しない」方針なら有効化する。
# --download-archive "history(Thumbnail).txt"


# ===== 必要時のみ: 強制上書き =====
# 取り直し（上書き）運用をするなら有効化候補
# --force-overwrites


# ===== 出力先は bat で上書き =====
# --output "D:\YouTube\サムネイル\%(title)s\%(title)s.%(ext)s"
