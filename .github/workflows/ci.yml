name: CI

# Secret-free CI: no real cookies/tokens, no real database, no video downloads,
# no external metadata fetch, no release publishing, no auto vulnerability
# exceptions. Backend tests run on SQLite; failures are never masked.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System build deps (psycopg2 is built from source)
        # requirements.lock pins source `psycopg2` (not the -binary wheel), so the
        # hash-pinned install must compile it. That needs libpq headers (libpq-dev),
        # a C compiler (gcc) AND the C stdlib headers (libc6-dev) — the same trio the
        # Dockerfile's wheel-build stage uses. Installed explicitly so CI never
        # depends on the runner image (and --no-install-recommends won't drop libc6-dev).
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libpq-dev gcc libc6-dev
      - name: Install (hash-pinned lock + dev test tooling)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install pytest httpx
      - name: Run backend tests
        run: pytest -q -p no:cacheprovider

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  guards:
    name: Static secret / path & compose guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refuse tracked secrets / data
        run: |
          set -e
          for bad in .env secrets cookies.txt; do
            if git ls-files --error-unmatch "$bad" >/dev/null 2>&1; then
              echo "::error::$bad must not be tracked"; exit 1
            fi
          done
          # no committed dumps / archives / release artifacts
          if git ls-files | grep -E '\.(sql\.gz|sqlite3)$|^(archive|backups|release)/' ; then
            echo "::error::data/backup/release artifacts must not be tracked"; exit 1
          fi
      - name: Refuse host paths / obvious secrets in source
        run: |
          # scan tracked product source (skip the archived dev history + tests,
          # which legitimately contain planted-leak fixtures for the scanner tests)
          if git grep -nE '/Users/[A-Za-z0-9._-]+|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- \
               'app/**' 'frontend/src/**' 'scripts/**' '*.md' 'docker-compose*.yml' Dockerfile \
               ':!docs/development-history.md' ; then
            echo "::error::possible host path or secret in tracked source"; exit 1
          fi
          echo "guard: no host paths / secrets found"
      - name: Compose config + secure-by-default bind
        run: |
          # env_file: .env must exist for `compose config` to resolve
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet && echo "compose syntax OK"
          # the DEFAULT web publish must be loopback-only, and datastores unpublished
          docker compose -f docker-compose.yml config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json, sys, ipaddress
          cfg = json.load(open("/tmp/compose.json"))
          svcs = cfg.get("services", {})
          def published(svc):
              return [p for p in (svcs.get(svc, {}).get("ports") or []) if p.get("published")]
          bad = []
          for p in published("web"):
              ip = (p.get("host_ip") or "").strip()
              try:
                  loop = ip != "" and ipaddress.ip_address(ip).is_loopback
              except ValueError:
                  loop = False
              if not loop:
                  bad.append(f"web published on {ip or '0.0.0.0'}:{p.get('published')} (not loopback)")
          for svc in ("postgres", "redis"):
              if published(svc):
                  bad.append(f"{svc} is host-published (datastore must not be exposed)")
          if bad:
              print("::error::insecure default compose bind:", "; ".join(bad)); sys.exit(1)
          print("compose secure-by-default: web loopback-only, datastores unpublished")
          PY
          rm -f .env
